name: Build Habit Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          unzip -q HabitTrackerAndroid-Project-fixed.zip
          cd HabitTrackerAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker30Hari-APK
          path: HabitTrackerAndroid/app/build/outputs/apk/debug/app-debug.apk
