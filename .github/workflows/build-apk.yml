name: Build Habit Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Extract Android Project
        run: |
          unzip -o HabitTrackerAndroid-Project-fixed.zip -d project

      - name: Find Gradle Project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build APK
        run: |
          cd project/HabitTrackerAndroid-Project-fixed
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTracker-APK
          path: project/**/build/outputs/apk/debug/*.apk
